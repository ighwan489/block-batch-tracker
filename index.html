<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, collection, doc, setDoc, updateDoc, deleteDoc, onSnapshot, writeBatch, arrayUnion, arrayRemove } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  import { getAuth, signInWithEmailAndPassword, signInAnonymously, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  const TEAM_EMAIL = "fmek@korea.com";
  const ADMIN_EMAIL = "admin@fmek-batchmate.local";

  const firebaseConfig = {
    apiKey: "AIzaSyBWggfffWmZXeVCDZ1OKloRLDa-VVD6MPE",
    authDomain: "fmek-lot.firebaseapp.com",
    projectId: "fmek-lot",
    storageBucket: "fmek-lot.firebasestorage.app",
    messagingSenderId: "1074158076481",
    appId: "1:1074158076481:web:0d13f402b5a949fe5a7cc0"
  };

  const isConfigured = !firebaseConfig.apiKey.includes('여기에');
  window.__firebaseReady = false;

  if(isConfigured){
    try{
      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);
      const recordsCol = collection(db, "blockRecords");

      window.fbAddRecord = async function(record){
        try{
          await setDoc(doc(recordsCol, record.id), record);
          return true;
        }catch(e){
          console.error('Firestore add error:', e);
          return false;
        }
      };

      window.fbUpdateRecord = async function(id, patch){
        try{
          await updateDoc(doc(recordsCol, id), patch);
          return true;
        }catch(e){
          console.error('Firestore update error:', e);
          return false;
        }
      };

      window.fbDeleteRecord = async function(id){
        try{
          await deleteDoc(doc(recordsCol, id));
          return true;
        }catch(e){
          console.error('Firestore delete error:', e);
          return false;
        }
      };

      window.fbBulkAdd = async function(records){
        try{
          const batch = writeBatch(db);
          records.forEach(r => batch.set(doc(recordsCol, r.id), r));
          await batch.commit();
          return true;
        }catch(e){
          console.error('Firestore bulk add error:', e);
          return false;
        }
      };

      window.fbBulkUpdate = async function(ids, patch){
        try{
          const batch = writeBatch(db);
          ids.forEach(id => batch.update(doc(recordsCol, id), patch));
          await batch.commit();
          return true;
        }catch(e){
          console.error('Firestore bulk update error:', e);
          return false;
        }
      };

      window.fbWatchRecords = function(onData, onError){
        onSnapshot(recordsCol, (snap)=>{
          const data = snap.docs.map(d => d.data());
          onData(data);
        }, (err)=>{
          console.error('Firestore watch error:', err);
          if(onError) onError(err);
        });
      };

      const auth = getAuth(app);

      window.fbLogin = async function(password){
        try{
          await signInWithEmailAndPassword(auth, TEAM_EMAIL, password);
          return true;
        }catch(e){
          console.error('Login error:', e);
          return false;
        }
      };

      window.fbAdminLogin = async function(password){
        try{
          await signInWithEmailAndPassword(auth, ADMIN_EMAIL, password);
          return true;
        }catch(e){
          console.error('Admin login error:', e);
          return false;
        }
      };

      window.fbGuestLogin = async function(){
        try{
          await signInAnonymously(auth);
          return true;
        }catch(e){
          console.error('Guest login error:', e);
          return false;
        }
      };

      window.fbOnAuthChange = function(callback){
        onAuthStateChanged(auth, (user) => callback(!!user, user ? !!user.isAnonymous : false, user ? user.email === ADMIN_EMAIL : false));
      };

      window.fbBulkDelete = async function(ids){
        try{
          const chunkSize = 450;
          for(let i = 0; i < ids.length; i += chunkSize){
            const chunk = ids.slice(i, i + chunkSize);
            const batch = writeBatch(db);
            chunk.forEach(id => batch.delete(doc(recordsCol, id)));
            await batch.commit();
          }
          return true;
        }catch(e){
          console.error('Firestore bulk delete error:', e);
          return false;
        }
      };

      window.fbLogout = async function(){
        try{
          await signOut(auth);
          return true;
        }catch(e){
          console.error('Logout error:', e);
          return false;
        }
      };

      window.fbArrayUnion = arrayUnion;

      // 성적서(압축된 base64 이미지)를 특정 레코드에 누적 추가 - Storage 없이 Firestore에 직접 저장
      window.fbAddCertificate = async function(id, certObj){
        try{
          await updateDoc(doc(recordsCol, id), { certificates: arrayUnion(certObj) });
          return true;
        }catch(e){
          console.error('Firestore certificate add error:', e);
          return false;
        }
      };

      // 특정 레코드에서 성적서 하나 제거 (certObj가 저장된 값과 정확히 일치해야 제거됨)
      window.fbRemoveCertificate = async function(id, certObj){
        try{
          await updateDoc(doc(recordsCol, id), { certificates: arrayRemove(certObj) });
          return true;
        }catch(e){
          console.error('Firestore certificate remove error:', e);
          return false;
        }
      };

      window.__firebaseReady = true;
    }catch(e){
      console.error('Firebase init error:', e);
      window.__firebaseReady = false;
    }
  }
  window.__firebaseChecked = true;
</script>
<style>

  .stats-row{ display:flex; gap:6px; margin-top:10px; flex-wrap:wrap; }
  .stat-chip{

    background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.18);

  .stat-chip .n{ font-family:'JetBrains Mono',monospace; font-size:13px; }

  .stat-chip.c-released .n{ color:#A6E4C2; }
  .stat-chip.c-total{ background:rgba(255,255,255,.18); border:1px solid rgba(255,255,255,.32); }

  .search-row{ margin-top:14px; position:relative; }
  .search-row input{
    width:100%; padding:11px 44px 11px 38px; border-radius:10px; border:none;
    font-family:'JetBrains Mono',monospace; font-size:14px; font-weight:500;

  .search-row input:disabled{ color:var(--steel-dark); font-weight:600; opacity:1; }
  .search-icon{ position:absolute; left:13px; top:50%; transform:translateY(-50%); opacity:.5; font-size:14px; }
  .multi-search-btn{
    position:absolute; right:6px; top:50%; transform:translateY(-50%);
    width:29px; height:29px; border-radius:7px; border:none; background:var(--steel-dark); color:#fff;
    font-size:13px; cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .multi-chip{
    margin-top:9px; display:flex; align-items:center; justify-content:space-between; gap:8px;
    background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.22); border-radius:9px; padding:8px 12px;

  .sort-row{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:10px; }
  .sort-row select{

  .selection-row{

  .card-select-chk{ width:18px; height:18px; margin-right:6px; flex-shrink:0; margin-top:2px; accent-color:var(--steel); cursor:pointer; }
  .empty{
    text-align:center; padding:60px 20px; color:var(--ink-muted);
  }
  .empty .big{ font-size:32px; margin-bottom:8px; }
  .empty p{ font-size:13.5px; margin:4px 0; }

  .card{
    background:var(--surface); border-radius:12px; overflow:hidden;
    box-shadow:0 1px 3px rgba(20,30,40,.08); border:1px solid var(--line);
    position:relative;
  }
  .card.blocked{ border-left:6px solid var(--amber); }

    opacity:.85;
  }
  .card.released{ border-left:6px solid var(--green); }
  .card.testing{ border-left:6px solid var(--blue); }

  .card-inner{ padding:14px 14px 14px 18px; }
  .card-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  .lot{ font-family:'JetBrains Mono',monospace; font-weight:700; font-size:15.5px; letter-spacing:.01em; }
  .product{ font-size:12.5px; color:var(--ink-muted); margin-top:2px; }

  .badge{
    font-size:10.5px; font-weight:700; padding:4px 10px 4px 7px; border-radius:20px; white-space:nowrap;

  .timeline{ position:relative; padding-left:24px; margin:14px 0 6px; }
  .timeline::before{ content:''; position:absolute; left:5px; top:4px; bottom:4px; width:2px; background:var(--line); }
  .tl-item{ position:relative; padding-bottom:20px; }
  .tl-item:last-child{ padding-bottom:0; }
  .tl-dot{ position:absolute; left:-24px; top:2px; width:13px; height:13px; border-radius:50%; background:var(--ink-muted); border:2px solid #fff; box-shadow:0 0 0 2px var(--line); }
  .tl-dot.testing{ background:var(--blue); box-shadow:0 0 0 2px #C7D8FC; }
  .tl-dot.blocked{ background:var(--amber); box-shadow:0 0 0 2px #F3C89A; }
  .tl-dot.released{ background:var(--green); box-shadow:0 0 0 2px #B7E3C9; }
  .tl-top{ display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; }
  .tl-date{ font-size:11.5px; color:var(--ink-muted); font-family:'JetBrains Mono',monospace; }
  .tl-by{ font-size:12.5px; font-weight:700; margin-top:5px; color:var(--ink); }
  .tl-legacy{ font-size:10.5px; color:var(--ink-muted); font-weight:500; }
  .timeline-empty{ text-align:center; padding:24px; color:var(--ink-muted); font-size:13px; }

  .fab{
    position:fixed; right:20px; bottom:20px; z-index:31;
    width:56px; height:56px; border-radius:50%; border:none;
    background:var(--amber); color:#fff; font-size:26px; font-weight:700;
    box-shadow:0 4px 14px rgba(180,83,10,.4); cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    max-width:720px; margin:0 auto;
    transition:transform .2s ease;
  }
  .fab-item{
    position:fixed; right:25px; bottom:20px; z-index:30;
    width:46px; height:46px; border-radius:50%; border:none;
    color:#fff; font-size:19px;
    box-shadow:0 4px 12px rgba(0,0,0,.22); cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    max-width:720px; margin:0 auto;
    opacity:0; pointer-events:none; transform:scale(.4);
    transition:transform .2s ease, opacity .16s ease, bottom .2s ease;
  }
  .fab-item.item-add{ background:var(--steel); }
  .fab-item.item-bulk{ background:#2F8F5B; }
  .fab-item.item-excel{ background:#1D6FEB; }
  .fab-item.item-cert{ background:#7C3AED; }
  .fab-wrap{ position:fixed; left:0; right:0; bottom:0; display:flex; justify-content:center; pointer-events:none; z-index:29; }
  .fab-wrap .fab-inner{ position:relative; width:100%; max-width:720px; height:0; pointer-events:none; }
  .fab-wrap button{ pointer-events:auto; }
  .fab-wrap.open .fab{ transform:rotate(45deg); }
  .fab-wrap.open .fab-item{ opacity:1; pointer-events:auto; transform:scale(1); }
  .fab-wrap.open .fab-item.item-add{ bottom:84px; }
  .fab-wrap.open .fab-item.item-bulk{ bottom:144px; }
  .fab-wrap.open .fab-item.item-excel{ bottom:204px; }
  .fab-wrap.open .fab-item.item-cert{ bottom:264px; }
  .fab-label{
    position:fixed; right:78px; z-index:30;
    background:var(--steel-dark); color:#fff; font-size:11.5px; font-weight:600;
    padding:5px 10px; border-radius:7px; white-space:nowrap;
    opacity:0; pointer-events:none; transition:opacity .16s ease;
    max-width:720px; margin:0 auto;
  }
  .fab-wrap.open .fab-label{ opacity:1; }
  .fab-label.label-add{ bottom:96px; }
  .fab-label.label-bulk{ bottom:156px; }
  .fab-label.label-excel{ bottom:216px; }
  .fab-label.label-cert{ bottom:276px; }

  .modal-tabs{ display:flex; gap:6px; margin-bottom:16px; background:#F1F3F5; border-radius:10px; padding:4px; }
  .modal-tab{ flex:1; text-align:center; padding:8px; border-radius:7px; font-size:12.5px; font-weight:600; color:var(--ink-muted); cursor:pointer; }
  .modal-tab.active{ background:#fff; color:var(--steel-dark); box-shadow:0 1px 2px rgba(0,0,0,.08); }
  .hint{ font-size:11.5px; color:var(--ink-muted); margin-top:5px; line-height:1.5; }
  .hint code{ background:#F1F3F5; padding:1px 5px; border-radius:4px; font-family:'JetBrains Mono',monospace; }
  .dropzone{
    border:2px dashed var(--line); border-radius:10px; padding:20px 14px; text-align:center;
    color:var(--ink-muted); font-size:13px; cursor:pointer; background:#FBFCFD;
  }
  .dropzone.drag{ border-color:var(--steel); background:#EAF0F5; }
  .dropzone input{ display:none; }
  .preview-table{ width:100%; border-collapse:collapse; font-size:12px; margin-top:10px; }
  .preview-table th{ text-align:left; font-size:10.5px; color:var(--ink-muted); font-weight:600; padding:4px 6px; border-bottom:1px solid var(--line); }
  .preview-table td{ padding:6px 6px; border-bottom:1px solid #EEF1F4; vertical-align:top; }
  .preview-table tr.invalid td{ color:var(--danger); }
  .preview-table .pv-lot{ font-family:'JetBrains Mono',monospace; font-weight:600; }
  .preview-table td.chk{ width:22px; }
  .preview-summary{ font-size:12px; color:var(--ink-muted); margin-top:8px; }
  .preview-summary b{ color:var(--steel-dark); }
  .preview-wrap{ max-height:260px; overflow-y:auto; border:1px solid var(--line); border-radius:8px; padding:0 8px; }

  .overlay{
    position:fixed; inset:0; background:rgba(20,26,33,.55); z-index:40;
    display:flex; align-items:flex-end; justify-content:center;
  }
  .modal{
    background:#fff; width:100%; max-width:720px; border-radius:18px 18px 0 0;
    padding:20px 20px 24px; max-height:88vh; overflow-y:auto;
    animation:slideup .2s ease-out;
  }
  @keyframes slideup{ from{ transform:translateY(24px); opacity:0;} to{ transform:translateY(0); opacity:1;} }
  .modal h2{
    font-family:'Oswald',sans-serif; font-size:17px; font-weight:600; text-transform:uppercase;
    letter-spacing:.02em; margin:0 0 16px; color:var(--steel-dark);
  }
  .field{ margin-bottom:13px; }
  .field-group{ background:#F7F8FA; border:1px solid var(--line); border-radius:10px; padding:12px 12px 2px; margin-bottom:13px; }
  .field-group-title{ font-size:11.5px; font-weight:700; color:var(--ink-muted); margin-bottom:10px; }
  .field-row-2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .field-group .field{ margin-bottom:10px; }
  .field label{ display:block; font-size:12px; font-weight:600; color:var(--ink-muted); margin-bottom:5px; }
  .field input, .field select, .field textarea{
    width:100%; padding:10px 12px; border-radius:9px; border:1px solid var(--line);
    font-family:'Inter',sans-serif; font-size:14px; color:var(--ink); background:#FBFCFD;
  }
  .field input:focus, .field select:focus, .field textarea:focus{ outline:2px solid var(--steel); outline-offset:0; border-color:var(--steel); }
  .field textarea{ resize:vertical; min-height:56px; font-family:'Inter',sans-serif; }
  .modal-actions{ display:flex; gap:10px; margin-top:18px; }
  .btn-cancel{ flex:1; padding:12px; border-radius:10px; border:1px solid var(--line); background:#fff; color:var(--ink-muted); font-weight:600; font-size:14px; cursor:pointer; }
  .btn-submit{ flex:2; padding:12px; border-radius:10px; border:none; background:var(--steel); color:#fff; font-weight:700; font-size:14px; cursor:pointer; }
  .btn-submit.danger{ background:var(--amber); }
  .err{ color:var(--danger); font-size:12px; margin-top:6px; display:none; }

  .toast{
    position:fixed; top:16px; left:50%; transform:translateX(-50%); z-index:50;
    background:var(--steel-dark); color:#fff; padding:10px 18px; border-radius:20px; font-size:13px; font-weight:600;
    box-shadow:0 4px 12px rgba(0,0,0,.2); opacity:0; pointer-events:none; transition:opacity .2s, transform .2s;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(6px); }

  .loading{ text-align:center; padding:60px 20px; color:var(--ink-muted); font-size:13px; }

  .setup-screen{
    position:fixed; inset:0; background:var(--bg); z-index:100;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .setup-box{
    max-width:440px; background:#fff; border-radius:16px; padding:32px 28px;
    box-shadow:0 4px 20px rgba(0,0,0,.08); border:1px solid var(--line);
  }
  .setup-icon{ font-size:36px; margin-bottom:10px; }
  .setup-box h2{ font-family:'Oswald',sans-serif; font-size:18px; color:var(--steel-dark); margin:0 0 12px; }
  .setup-box p{ font-size:13px; color:var(--ink-muted); line-height:1.6; margin:0 0 14px; }
  .setup-box code{ background:#F1F3F5; padding:1px 6px; border-radius:4px; font-family:'JetBrains Mono',monospace; font-size:12px; }
  .setup-box ol{ font-size:12.5px; color:var(--ink); line-height:1.9; padding-left:20px; margin:0; }

  .login-input{
    width:100%; padding:12px 14px; border-radius:9px; border:1px solid var(--line);
    font-size:15px; margin-top:14px; text-align:center; letter-spacing:.05em;
  }
  .login-input:focus{ outline:2px solid var(--steel); border-color:var(--steel); }
  .login-err{ color:var(--danger); font-size:12.5px; margin-top:8px; display:none; }
</style>
</head>
<body>

<div class="app" id="app">
  <header>
    <div class="header-top">
      <div>
        <h1>BatchMate</h1>
        <div class="subtitle" id="subtitle">의약품 시험검사 & Block Batch 통합관리</div>
      </div>
      <div style="display:flex; gap:8px; align-items:flex-start;">
        <button class="logout-btn" id="resetAllBtn" style="display:none; background:rgba(255,255,255,.1); border-color:var(--amber);">전체 초기화</button>
        <button class="logout-btn" id="logoutBtn">로그아웃</button>
      </div>
    </div>
    <div class="stats-row">
      <div class="stat-chip c-testing">시험검사중 <span class="n" id="testingCount">-</span></div>
      <div class="stat-chip c-blocked">블락중 <span class="n" id="activeCount">-</span></div>
      <div class="stat-chip c-released">해제됨 <span class="n" id="releasedCount">-</span></div>
      <div class="stat-chip c-total">누적 <span class="n" id="totalCount">-</span></div>
    </div>
    <div class="search-row">
      <span class="search-icon">🔍</span>
      <input id="searchInput" type="text" placeholder="제품코드, LOT 번호, 제품명 검색" autocomplete="off">
      <button class="multi-search-btn" id="openMultiSearch" title="여러 LOT 한번에 검색">☰</button>
    </div>
    <div class="multi-chip" id="multiChip" style="display:none;"></div>
    <div class="tabs" id="tabs">
      <div class="tab active" data-filter="all">📋 전체</div>
      <div class="tab" data-filter="testing">🔬 시험검사중</div>
      <div class="tab" data-filter="blocked">⛔ 블락중</div>
      <div class="tab" data-filter="released">✅ 해제됨</div>
    </div>
    <div class="sort-row">
      <select id="sortSelect">
        <option value="recent">최신 등록순</option>
        <option value="lot">LOT명순</option>
        <option value="elapsed">경과일 오래된순</option>
        <option value="test-pass">시험검사 적합</option>
        <option value="block-release">블락 해제</option>
      </select>
      <select id="statusCodeFilterSelect">
        <option value="">상태값 전체</option>
        <option value="A">[A]정상</option>
        <option value="B">[B]판정대기</option>
        <option value="D">[D]부적합</option>
        <option value="E">[E]유효기간경과</option>
        <option value="F">[F]유효기간임박</option>
        <option value="Q">[Q]Quarantine</option>
        <option value="R">[R]Retain Sample</option>
      </select>
      <button class="print-btn" id="openPrintView">🖨 인쇄용 요약</button>
    </div>
  </header>

  <div class="action-bar" id="actionBar" style="display:none;"></div>
  <div id="selectionBar" style="display:none; margin:14px 14px 0;"></div>
  <div class="list" id="list">
    <div class="loading">불러오는 중...</div>
  </div>
</div>

<div class="fab-wrap" id="fabWrap"><div class="fab-inner">
  <span class="fab-label label-cert" id="fabLabelCert">성적서 업로드</span>
  <button class="fab-item item-cert" id="openCertUpload" title="성적서(출하승인서) 업로드">🧾</button>
  <span class="fab-label label-excel" id="fabLabelExcel">엑셀 다운로드</span>
  <button class="fab-item item-excel" id="exportExcel" title="현재 목록 엑셀 다운로드">📊</button>
  <span class="fab-label label-bulk" id="fabLabelBulk">일괄 등록</span>
  <button class="fab-item item-bulk" id="openBulk" title="여러 건 한번에 업로드">📥</button>
  <span class="fab-label label-add" id="fabLabelAdd">개별 등록</span>
  <button class="fab-item item-add" id="openAdd" title="새 항목 등록">📝</button>
  <button class="fab" id="fabToggle" title="메뉴 열기/닫기">+</button>
</div></div>

<div class="toast" id="toast"></div>

<script>
let records = [];
let currentFilter = 'all';
let searchTerm = '';
let multiLotTokens = [];
let myName = '';
let isGuestMode = false;
let isAdminMode = false;
let selectedIds = new Set();
let sortOption = 'recent';
let statusCodeFilter = '';

const REASONS = ['신규배치 시험검사(출하승인 대기)','품질이상','유효기간 임박/만료','서류 미비','고객 반품/클레임','재고 수량 불일치','PI(입고검사) 보류','기타'];
// 사유(reason)와 메모(memo)를 한 줄로 합쳐서 보여줌 - 새로 만드는 레코드는 reason 하나에만 입력하지만, memo가 남아있는 기존 레코드도 자연스럽게 같이 표시됨
function reasonMemoText(r){
  return [r && r.reason, r && r.memo].filter(Boolean).join(' · ');
}
const STATUS_CODES = { A:'정상', B:'판정대기', D:'부적합', E:'유효기간경과', F:'유효기간임박', Q:'Quarantine', R:'Retain Sample' };
const STATUS_CODE_ORDER = ['A','B','D','E','F','Q','R'];
function statusCodeLabel(code){
  if(!code || !STATUS_CODES[code]) return '';
  return `[${code}]${STATUS_CODES[code]}`;
}
function statusCodeOptionsHtml(selected){
  const opts = ['<option value="">선택 안함</option>'];
  STATUS_CODE_ORDER.forEach(c => opts.push(`<option value="${c}" ${selected===c?'selected':''}>[${c}]${STATUS_CODES[c]}</option>`));
  return opts.join('');
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}

function genId(){
  return Date.now().toString(36) + Math.random().toString(36).slice(2,7);
}

function fmtDate(iso){
  const d = new Date(iso);
  const pad = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}.${pad(d.getMonth()+1)}.${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function elapsedDays(iso){
  if(!iso) return 0;
  const ms = Date.now() - new Date(iso).getTime();
  return Math.max(0, Math.floor(ms / 86400000));
}

function elapsedBasisIso(r){
  if(r.status === 'testing') return r.testRequestedAt || r.registeredAt;
  if(r.status === 'blocked') return r.testFailAt || r.registeredAt;
  return r.registeredAt;
}

function elapsedBadgeHtml(r){
  const days = elapsedDays(elapsedBasisIso(r));
  if(r.status === 'testing'){
    if(days > 45) return `<span class="elapsed-badge warn3">🔴 ${days}일 경과 (장기지연)</span>`;
    if(days > 30) return `<span class="elapsed-badge warn2">🟡 ${days}일 경과 (지연)</span>`;
    return '';
  }
  if(r.status === 'blocked'){
    if(days > 365) return `<span class="elapsed-badge warn3">🔴 ${days}일 경과 (초장기)</span>`;
    if(days > 180) return `<span class="elapsed-badge warn2">🟠 ${days}일 경과 (장기)</span>`;
    if(days > 30) return `<span class="elapsed-badge warn1">🟡 ${days}일 경과</span>`;
    return '';
  }
  return '';
}

function loadMyName(){
  try{
    const v = localStorage.getItem('blockTracker_myName');
    if(v) myName = v;
  }catch(e){ /* localStorage 사용 불가 */ }
}

function saveMyName(name){
  myName = name;
  try{ localStorage.setItem('blockTracker_myName', name); }catch(e){}
}

function waitForFirebase(){
  return new Promise((resolve)=>{
    const check = ()=>{
      if(window.__firebaseChecked) resolve();
      else setTimeout(check, 50);
    };
    check();
  });
}

function initRealtimeSync(){
  document.getElementById('list').innerHTML = '<div class="loading">불러오는 중...</div>';
  window.fbWatchRecords(
    (data) => { records = data; render(); },
    (err) => { showToast('실시간 동기화 연결 실패 - 새로고침 해주세요'); }
  );
}

  function getFiltered(){
  let list = [...records];
  if(currentFilter === 'testing') list = list.filter(r => r.status === 'testing');
  if(currentFilter === 'blocked') list = list.filter(r => r.status === 'blocked');
  if(currentFilter === 'released') list = list.filter(r => r.status === 'released');
  if(statusCodeFilter) list = list.filter(r => r.statusCode === statusCodeFilter);

  if(multiLotTokens.length > 0){
    list = list.filter(r => {
      const lot = r.lot.toLowerCase();
      const code = (r.code || '').toLowerCase();
      return multiLotTokens.some(t => lot === t || lot.includes(t) || code === t);
    });
  } else if(searchTerm.trim()){
    const q = searchTerm.trim().toLowerCase();
    list = list.filter(r => r.lot.toLowerCase().includes(q) || r.product.toLowerCase().includes(q) || (r.code||'').toLowerCase().includes(q));
  }

  if(sortOption === 'test-pass'){
    list = list.filter(r => r.status === 'released' && getReleasedFrom(r) === 'testing');
  }
  if(sortOption === 'block-release'){
    list = list.filter(r => r.status === 'released' && getReleasedFrom(r) === 'blocked');
  }

  if(sortOption === 'lot'){
    return list.sort((a,b) => a.lot.localeCompare(b.lot, 'ko'));
  }
  if(sortOption === 'elapsed'){
    return list.sort((a,b) => {
      const da = new Date(elapsedBasisIso(a) || a.registeredAt);
      const db = new Date(elapsedBasisIso(b) || b.registeredAt);
      return da - db;
    });
  }
  return list.sort((a,b) => new Date(b.registeredAt) - new Date(a.registeredAt));
}

const STATUS_LABEL = { testing:'시험검사중', blocked:'블락중', released:'해제됨' };
const STATUS_ICON = { testing:'🔬', blocked:'⛔', released:'✅' };

function getReleasedFrom(r){
  if(r.releasedFrom === 'testing' || r.releasedFrom === 'blocked') return r.releasedFrom;
  // 기존 데이터(필드 없음)는 해제 메모 텍스트로 추측 분류
  const memo = (r.releaseMemo || '').toString();
  return memo.includes('시험검사') ? 'testing' : 'blocked';
}

function render(){
  updateMultiChip();
  const isNarrowed = multiLotTokens.length > 0 || searchTerm.trim() || currentFilter !== 'all' || statusCodeFilter;
  const filteredTestingList = getFiltered().filter(r => r.status === 'testing');
  const filteredBlockedList = getFiltered().filter(r => r.status === 'blocked');
  document.getElementById('testingCount').textContent = records.filter(r => r.status === 'testing').length;
  document.getElementById('activeCount').textContent = records.filter(r => r.status === 'blocked').length;
  document.getElementById('releasedCount').textContent = records.filter(r => r.status === 'released').length;
  document.getElementById('totalCount').textContent = records.length;

  const bar = document.getElementById('actionBar');
  let rows = '';
  if(filteredTestingList.length > 0){
    const label = isNarrowed ? `🔵 검색·필터된 시험검사중 ${filteredTestingList.length}건` : `🔵 시험검사중 ${filteredTestingList.length}건`;
    rows += `<div class="action-row"><span>${label}</span>${isGuestMode ? '' : `<button onclick="openBulkTestResult()">일괄 검사결과 처리</button>`}</div>`;
  }
  if(filteredBlockedList.length > 0){
    const label = isNarrowed ? `🟠 검색·필터된 블락중 ${filteredBlockedList.length}건` : `🟠 블락중 ${filteredBlockedList.length}건`;
    rows += `<div class="action-row amber"><span>${label}</span>${isGuestMode ? '' : `<button onclick="openBulkRelease()">일괄 해제 처리</button>`}</div>`;
  }
  if(rows){
    bar.style.display = 'flex';
    bar.innerHTML = rows;
  } else {
    bar.style.display = 'none';
  }

  const list = getFiltered();
  const el = document.getElementById('list');
  renderSelectionBar(list);

  if(list.length === 0){
    el.innerHTML = `<div class="empty">
      <div class="big">📋</div>
      <p><b>기록이 없어요</b></p>
      <p>${records.length === 0 ? '우측 하단 + 버튼으로 첫 건을 등록해보세요' : '검색·필터 조건에 맞는 항목이 없어요'}</p>
    </div>`;
    return;
  }

  el.innerHTML = list.map(r => {
    const status = r.status;
    return `
    <div class="card ${status}">
      <div class="card-inner">
        <div class="card-top">
          <div style="display:flex; align-items:flex-start;">
            ${isGuestMode ? '' : `<input type="checkbox" class="card-select-chk" ${selectedIds.has(r.id) ? 'checked' : ''} onchange="toggleSelect('${r.id}', this.checked)">`}
            <div>
              <div class="lot">${escapeHtml(r.lot)}${r.code ? ` <span style="color:var(--ink-muted); font-weight:500; font-size:12px;">· ${escapeHtml(r.code)}</span>` : ''}</div>
              <div class="product">${escapeHtml(r.product)}</div>
            </div>
          </div>
          <div style="display:flex; flex-direction:column; align-items:flex-end; gap:6px;">
            <span class="badge ${status}">${STATUS_ICON[status] || ''} ${STATUS_LABEL[status]}</span>
            ${r.statusCode && STATUS_CODES[r.statusCode] ? `<span class="status-badge code-${r.statusCode}" style="margin:0;">${escapeHtml(statusCodeLabel(r.statusCode))}</span>` : ''}
          </div>
        </div>
        ${elapsedBadgeHtml(r)}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

function makeHistoryEntry(status, by, memo, at){
  return { status, by: by || '', memo: memo || '', at: at || new Date().toISOString() };
}

// history 필드가 없는 옛날 레코드는 등록/부적합/해제 시각을 조합해 이력을 합성해서 보여줌 ("(추정)" 표시)
function getRecordHistory(rec){
  if(Array.isArray(rec.history) && rec.history.length > 0){
    return [...rec.history].sort((a,b) => new Date(a.at) - new Date(b.at));
  }
  const list = [];
  const firstStatus = rec.testFailAt ? 'testing' : (rec.status === 'testing' ? 'testing' : (rec.status === 'blocked' ? 'blocked' : (rec.releasedAt ? 'blocked' : 'testing')));
  list.push({ status: firstStatus, by: rec.registeredBy, memo: rec.reason || '', at: rec.registeredAt, _legacy: true });
  if(rec.testFailAt){
    list.push({ status: 'blocked', by: rec.testFailBy, memo: rec.testFailMemo || '', at: rec.testFailAt, _legacy: true });
  }
  if(rec.releasedAt){
    list.push({ status: 'released', by: rec.releasedBy, memo: rec.releaseMemo || '', at: rec.releasedAt, _legacy: true });
  }
  return list.sort((a,b) => new Date(a.at) - new Date(b.at));
}

async function submitAdd(){

  const receivedAtRaw = document.getElementById('f_receivedAt').value;
  const ibdNo = document.getElementById('f_ibdNo').value.trim();
  const expectedCompleteAtRaw = document.getElementById('f_expectedCompleteAt').value;

  if(!lot || !product || !by){
    document.getElementById('f_err').style.display = 'block';
    return;
  }

  const data = { code, lot, product, reason, statusCode, by, testRequestedAtRaw, receivedAtRaw, ibdNo, expectedCompleteAtRaw };

      '그래도 등록',

    );

  doAddRecord(data);
}

async function doAddRecord(data){
  const { code, lot, product, reason, statusCode, by, testRequestedAtRaw, receivedAtRaw, ibdNo, expectedCompleteAtRaw } = data;
  const isTesting = addStatus === 'testing';
  const testRequestedAt = (isTesting && testRequestedAtRaw) ? new Date(testRequestedAtRaw + 'T00:00:00').toISOString() : null;
  const receivedAt = (isTesting && receivedAtRaw) ? new Date(receivedAtRaw + 'T00:00:00').toISOString() : null;
  const expectedCompleteAt = (isTesting && expectedCompleteAtRaw) ? new Date(expectedCompleteAtRaw + 'T00:00:00').toISOString() : null;
  const nowIso = new Date().toISOString();

  const rec = {
    id: genId(),
    lot, product, code, reason, memo: '',
    statusCode: statusCode || '',
    registeredBy: by,
    registeredAt: nowIso,
    status: addStatus,
    testRequestedAt,
    receivedAt,
    ibdNo: isTesting ? (ibdNo || '') : '',
    expectedCompleteAt,
    releasedBy: null, releasedAt: null, releaseMemo: null,
    testFailBy: null, testFailAt: null, testFailMemo: null,
    history: [makeHistoryEntry(addStatus, by, reason, nowIso)]
  };
  records.push(rec);
  render();
  closeOverlay('addOverlay');
  await saveMyName(by);
  const ok = await window.fbAddRecord(rec);
  showToast(ok ? (addStatus === 'testing' ? '시험검사중으로 등록 완료' : '블락 등록 완료') : '등록됐지만 저장에 실패했어요');
}

async function submitEdit(id){
  const code = document.getElementById('e_code').value.trim();
  const lot = document.getElementById('e_lot').value.trim();
  const product = document.getElementById('e_product').value.trim();
  const reason = document.getElementById('e_reason').value.trim();
  const statusCode = document.getElementById('e_statusCode').value;

  if(!lot || !product){
    document.getElementById('e_err').style.display = 'block';
    return;
  }

  const rec = records.find(r => r.id === id);
  if(!rec) return;

  const lotChanged = lot.toLowerCase() !== rec.lot.trim().toLowerCase();
  const patch = { code, lot, product, reason, memo: '', statusCode: statusCode || '' };
  {
    const testDateEl = document.getElementById('e_testRequestedAt');
    const raw = testDateEl ? testDateEl.value : '';
    patch.testRequestedAt = raw ? new Date(raw + 'T00:00:00').toISOString() : null;

    const receivedRaw = document.getElementById('e_receivedAt') ? document.getElementById('e_receivedAt').value : '';
    patch.receivedAt = receivedRaw ? new Date(receivedRaw + 'T00:00:00').toISOString() : null;

    patch.ibdNo = document.getElementById('e_ibdNo') ? document.getElementById('e_ibdNo').value.trim() : '';

    const expectedRaw = document.getElementById('e_expectedCompleteAt') ? document.getElementById('e_expectedCompleteAt').value : '';
    patch.expectedCompleteAt = expectedRaw ? new Date(expectedRaw + 'T00:00:00').toISOString() : null;
  }

  if(lotChanged){
    const dup = records.find(r => r.id !== id && r.lot.trim().toLowerCase() === lot.toLowerCase());
    if(dup){
      showAppConfirm(
        `이미 등록된 LOT과 겹쳐요 (상태: ${STATUS_LABEL[dup.status] || dup.status}).\n그래도 저장할까요?`,
        '그래도 저장',
        ()=> doSaveEdit(id, rec, patch)
      );
      return;
    }
  }
  doSaveEdit(id, rec, patch);
}

async function doSaveEdit(id, rec, patch){
  Object.assign(rec, patch);
  render();
  closeOverlay('editOverlay');
  const ok = await window.fbUpdateRecord(id, patch);
  showToast(ok ? '수정 완료' : '수정됐지만 저장에 실패했어요');
}

async function submitTestResult(id){

async function revertRecord(id){
  const rec = records.find(r => r.id === id);
  if(!rec) return;

  let newStatus = null;
  let clearFields = {};
  let confirmMsg = '';

  if(rec.status === 'released'){
    newStatus = rec.releasedFrom === 'blocked' ? 'blocked' : 'testing';
    clearFields = { releasedBy: null, releasedAt: null, releaseMemo: null, releasedFrom: null };
    confirmMsg = `해제 처리를 취소하고 "${STATUS_LABEL[newStatus]}" 상태로 되돌릴까요?`;
  } else if(rec.status === 'blocked' && rec.testFailBy){
    newStatus = 'testing';
    clearFields = { testFailBy: null, testFailAt: null, testFailMemo: null };
    confirmMsg = `부적합 처리를 취소하고 "시험검사중" 상태로 되돌릴까요?`;
  } else {
    return; // 되돌릴 이전 상태가 없음
  }

  showAppConfirm(
    confirmMsg + '\n(이 작업도 이력에 기록돼요)',
    '되돌리기',
    ()=> doRevertRecord(id, newStatus, clearFields)
  );
}

async function doRevertRecord(id, newStatus, clearFields){
  const rec = records.find(r => r.id === id);
  if(!rec) return;

  const by = myName || '';
  const entry = makeHistoryEntry(newStatus, by, '되돌리기', new Date().toISOString());

  rec.status = newStatus;
  Object.assign(rec, clearFields);
  rec.history = [...(rec.history || []), entry];
  render();

  const patch = { status: newStatus, ...clearFields, history: window.fbArrayUnion(entry) };
  const ok = await window.fbUpdateRecord(id, patch);
  showToast(ok ? '되돌리기 완료' : '되돌렸지만 저장에 실패했어요');
}

function looksLikeHeader(cols){
  const joined = cols.join(' ').toLowerCase();
  return joined.includes('lot') || joined.includes('품목') || joined.includes('배치');
}

// 헤더 셀 텍스트 -> 내부 필드명 매칭용 별칭 목록. "상태값"(라벨, 예: [A]정상)은 일부러 매핑하지 않음 - 코드 원본은 "상태값코드"로만 받음
const FIELD_ALIASES = {
  code: ['제품코드','품목코드','코드'],
  lot: ['lot번호','lot','로트번호','로트','배치번호'],
  product: ['제품명','품목명'],
  reason: ['사유(메모)','사유','메모','비고'],
  statusCode: ['상태값코드','상태값','상태코드'],
  testRequestedAt: ['검사의뢰일','의뢰일'],
  receivedAt: ['입고일'],
  ibdNo: ['ibd번호','ibd'],
  expectedCompleteAt: ['완료예정일','완료일']
};
// 헤더 없이 그냥 값만 붙여넣었을 때 쓰는 기본 열 순서 (기존 방식과 동일)
const DEFAULT_COLUMN_MAP = { code:0, lot:1, product:2, reason:3, statusCode:4, testRequestedAt:5, receivedAt:6, ibdNo:7, expectedCompleteAt:8 };

function normalizeHeaderCell(s){
  return (s ?? '').toString().trim().toLowerCase().replace(/\s+/g, '');
}

// 헤더 줄의 각 칸이 어떤 필드인지 자동으로 찾아서 {필드명: 열번호} 맵을 만듦
function detectColumnMap(headerCols){
  const headerNorm = headerCols.map(normalizeHeaderCell);
  const map = {};
  Object.keys(FIELD_ALIASES).forEach(field=>{
    const aliases = FIELD_ALIASES[field].map(normalizeHeaderCell);
    const idx = headerNorm.findIndex(h => aliases.includes(h));
    if(idx !== -1) map[field] = idx;
  });
  return map;
}

function parseDelimitedText(text){
  const lines = text.split(/\r?\n/).map(l=>l.trim()).filter(l=>l.length>0);
  if(lines.length === 0) return [];
  let dataLines = lines;
  const firstCols = lines[0].split(/\t|,/).map(c=>c.trim());
  let columnMap = DEFAULT_COLUMN_MAP;
  if(looksLikeHeader(firstCols)){
    const detected = detectColumnMap(firstCols);
    // LOT·제품명 열을 헤더에서 못 찾으면 신뢰할 수 없으니 기본 순서로 폴백
    if(detected.lot !== undefined && detected.product !== undefined) columnMap = detected;
    dataLines = lines.slice(1);
  }

  return dataLines.map(line=>{
    const cols = line.split('\t').length > 1 ? line.split('\t') : line.split(',');
    const c = cols.map(x=>(x||'').trim());
    return normalizeRow(c, columnMap);
  });
}

function parseFile(file){
  return new Promise((resolve, reject)=>{
    const name = file.name.toLowerCase();
    const reader = new FileReader();
    reader.onerror = ()=> { showToast('파일을 읽지 못했어요'); resolve([]); };
    if(name.endsWith('.csv')){
      reader.onload = (e)=>{
        try{ resolve(parseDelimitedText(e.target.result)); }
        catch(err){ showToast('CSV 파싱 실패'); resolve([]); }
      };
      reader.readAsText(file, 'UTF-8');
    } else {
      reader.onload = (e)=>{
        try{
          const wb = XLSX.read(new Uint8Array(e.target.result), { type:'array' });
          const sheet = wb.Sheets[wb.SheetNames[0]];
          const rows = XLSX.utils.sheet_to_json(sheet, { header:1, defval:'' });
          let data = rows.filter(r => r.some(c => String(c).trim() !== ''));
          let columnMap = DEFAULT_COLUMN_MAP;
          if(data.length && looksLikeHeader(data[0].map(String))){
            const detected = detectColumnMap(data[0].map(String));
            if(detected.lot !== undefined && detected.product !== undefined) columnMap = detected;
            data = data.slice(1);
          }
          resolve(data.map(r => normalizeRow(r, columnMap)));
        }catch(err){ showToast('엑셀 파싱 실패 - 파일 형식을 확인해주세요'); resolve([]); }
      };
      reader.readAsArrayBuffer(file);
    }
  });
}

function normalizeStatusCode(raw){
  const s = (raw ?? '').toString().trim().toUpperCase().replace(/^\[|\]$/g, '');
  return STATUS_CODES[s] ? s : '';
}

// "2026-07-20" / "2026.07.20" / "2026/07/20" 등 흔한 구분자를 모두 인식해 ISO 문자열로 변환. 실패하면 null
function parseDateFlexible(raw){
  const s = (raw ?? '').toString().trim();
  if(!s) return null;
  const normalized = s.replace(/[./]/g, '-');
  const m = normalized.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if(!m) return null;
  const iso = `${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}T00:00:00`;
  const d = new Date(iso);
  return isNaN(d.getTime()) ? null : d.toISOString();
}

// 카드·미리보기에서 공용으로 쓰는 "입고일 : ... / IBD : ... / 완료예정일 : ..." 요약 텍스트
function testInfoSummary(obj){
  return [
    obj.receivedAt ? `입고일 : ${fmtDate(obj.receivedAt).split(' ')[0]}` : '',
    obj.ibdNo ? `IBD : ${obj.ibdNo}` : '',
    obj.expectedCompleteAt ? `완료예정일 : ${fmtDate(obj.expectedCompleteAt).split(' ')[0]}` : ''
  ].filter(Boolean).join(' / ');
}

function normalizeRow(cols, columnMap){
  cols = cols || [];
  columnMap = columnMap || DEFAULT_COLUMN_MAP;
  const get = (field) => {
    const idx = columnMap[field];
    return idx === undefined ? '' : cols[idx];
  };
  const code = (get('code') ?? '').toString().trim();
  const lot = (get('lot') ?? '').toString().trim();
  const product = (get('product') ?? '').toString().trim();
  const reason = (get('reason') ?? '').toString().trim() || '기타';
  const memo = '';
  const statusCode = normalizeStatusCode(get('statusCode'));
  const testRequestedAt = parseDateFlexible(get('testRequestedAt'));
  const receivedAt = parseDateFlexible(get('receivedAt'));
  const ibdNo = (get('ibdNo') ?? '').toString().trim();
  const expectedCompleteAt = parseDateFlexible(get('expectedCompleteAt'));
  const valid = !!lot && !!product;
  return { code, lot, product, reason, memo, statusCode, testRequestedAt, receivedAt, ibdNo, expectedCompleteAt, valid, include: valid };
}

function findDupInfo(lot){
  if(!lot) return null;
  const existing = records.find(r => r.lot.trim().toLowerCase() === lot.toLowerCase());
  if(existing) return `기존 등록됨(${STATUS_LABEL[existing.status] || existing.status})`;
  return null;
}

function renderPreview(){
  if(bulkMode === 'edit'){ renderEditPreview(); return; }

  const validCount = bulkRows.filter(r=>r.valid).length;
  const seen = {};
  bulkRows.forEach(r=>{
    const key = r.lot.toLowerCase();
    r._existingDup = r.valid ? findDupInfo(r.lot) : null;
    r._withinDup = r.valid && key && seen[key];
    if(r.valid && key) seen[key] = true;
  });
  const dupCount = bulkRows.filter(r => r._existingDup || r._withinDup).length;

  document.getElementById('previewSummary').innerHTML =
    `총 <b>${bulkRows.length}</b>행 인식 · 유효 <b>${validCount}</b>건 ${bulkRows.length - validCount > 0 ? `· LOT/제품명 누락 ${bulkRows.length - validCount}건은 제외됐어요` : ''}${dupCount > 0 ? ` · <span style="color:var(--danger);">중복 LOT ${dupCount}건 발견 (체크 확인해주세요)</span>` : ''}`;

  const table = document.getElementById('previewTable');
  table.innerHTML = `
    <thead><tr><th></th><th>제품코드</th><th>LOT</th><th>제품명</th><th>사유(메모)</th><th>상태값</th><th>테스트정보</th><th>중복</th></tr></thead>
    <tbody>
      ${bulkRows.map((r,i)=>{
        const testInfo = [
          r.testRequestedAt ? `의뢰일:${fmtDate(r.testRequestedAt).split(' ')[0]}` : '',
          r.receivedAt ? `입고일:${fmtDate(r.receivedAt).split(' ')[0]}` : '',
          r.ibdNo ? `IBD:${r.ibdNo}` : '',
          r.expectedCompleteAt ? `완료예정:${fmtDate(r.expectedCompleteAt).split(' ')[0]}` : ''
        ].filter(Boolean).join(' / ');
        return `
        <tr class="${r.valid ? '' : 'invalid'}">
          <td class="chk"><input type="checkbox" ${r.include ? 'checked':''} ${r.valid?'':'disabled'} onchange="bulkRows[${i}].include=this.checked"></td>
          <td>${escapeHtml(r.code) || '-'}</td>

document.addEventListener('click', function(e){

async function submitBulk(){
  if(bulkMode === 'edit'){ return submitBulkEdit(); }

  const by = document.getElementById('bulk_by').value.trim();
  const toAdd = bulkRows.filter(r => r.valid && r.include);
  if(!by || toAdd.length === 0){
    document.getElementById('bulk_err').style.display = 'block';
    return;
  }
  const now = new Date().toISOString();
  const isTesting = bulkStatus === 'testing';
  const newRecords = toAdd.map((r, i) => ({
    id: genId() + i,
    lot: r.lot, product: r.product, code: r.code, reason: r.reason, memo: r.memo,
    statusCode: r.statusCode || '',
    registeredBy: by,
    registeredAt: now,
    status: bulkStatus,
    testRequestedAt: isTesting ? (r.testRequestedAt || null) : null,
    receivedAt: isTesting ? (r.receivedAt || null) : null,
    ibdNo: isTesting ? (r.ibdNo || '') : '',
    expectedCompleteAt: isTesting ? (r.expectedCompleteAt || null) : null,
    releasedBy: null, releasedAt: null, releaseMemo: null,
    testFailBy: null, testFailAt: null, testFailMemo: null
  }));
  newRecords.forEach(rec => records.push(rec));
  render();
  closeOverlay('bulkOverlay');
  await saveMyName(by);
  const ok = await window.fbBulkAdd(newRecords);
  showToast(ok ? `${toAdd.length}건 일괄 등록 완료` : '등록됐지만 저장에 실패했어요');
}

// 일괄 수정 - LOT이 매칭된 레코드들의 제품코드/제품명/사유/메모/상태값을 붙여넣은 값으로 전부 덮어씀
async function submitBulkEdit(){
  const by = document.getElementById('bulk_by').value.trim();
  const toEdit = bulkRows.filter(r => r.valid && r.include && r._editMatch);
  if(!by || toEdit.length === 0){
    document.getElementById('bulk_err').style.display = 'block';
    return;
  }

  let successCount = 0;
  let failCount = 0;
  for(const r of toEdit){
    const rec = r._editMatch;
    const patch = { code: r.code, product: r.product, reason: r.reason, memo: r.memo, statusCode: r.statusCode || '' };
    patch.testRequestedAt = r.testRequestedAt || null;
    patch.receivedAt = r.receivedAt || null;
    patch.ibdNo = r.ibdNo || '';
    patch.expectedCompleteAt = r.expectedCompleteAt || null;
    const ok = await window.fbUpdateRecord(rec.id, patch);
    if(ok){
      Object.assign(rec, patch);
      successCount++;
    } else {
      failCount++;
    }
  }
  render();
  closeOverlay('bulkOverlay');
  await saveMyName(by);
  showToast(failCount === 0 ? `${successCount}건 일괄 수정 완료` : `${successCount}건 수정 완료, ${failCount}건 실패`);
}

function initCertPasteZoneListeners(){
  const zone = document.getElementById('certPasteZone');
  const fileInput = document.getElementById('certFileInput');
  if(!zone || !fileInput) return;

  zone.addEventListener('click', ()=>{
    if(certCropArmed || certImageDataUrl) return; // 크롭 중이거나 이미지가 이미 있으면 파일선택 재오픈 방지
    fileInput.click();
  });
  zone.addEventListener('paste', (e)=>{
    const items = e.clipboardData ? e.clipboardData.items : [];
    for(const item of items){
      if(item.type.indexOf('image') !== -1){
        const file = item.getAsFile();
        loadCertImage(file);
        e.preventDefault();
        break;
      }
    }
  });
  ['dragover','dragenter'].forEach(evt => zone.addEventListener(evt, e=>{ e.preventDefault(); zone.classList.add('drag'); }));
  ['dragleave','drop'].forEach(evt => zone.addEventListener(evt, e=>{ e.preventDefault(); zone.classList.remove('drag'); }));
  zone.addEventListener('drop', e=>{
    if(e.dataTransfer.files.length) loadCertImage(e.dataTransfer.files[0]);
  });
  fileInput.addEventListener('change', ()=>{
    if(fileInput.files.length) loadCertImage(fileInput.files[0]);
  });
}

// 이메일/표 텍스트를 그대로 붙여넣은 경우 - OCR 없이 텍스트에서 바로 제조번호를 찾음 (훨씬 정확함)
function analyzeCertText(){
  const raw = document.getElementById('certTextInput').value;
  if(!raw || !raw.trim()){ showToast('내용을 먼저 붙여넣어주세요'); return; }
  certRawText = raw;
  const normText = raw.replace(/[\s\-_]/g, '').toUpperCase();
  const canonText = ocrCanonical(normText);
  certCanonText = canonText;

  const matched = records.filter(r => {
    const normLot = (r.lot || '').replace(/[\s\-_]/g, '').toUpperCase();
    if(normLot.length < 4) return false;
    if(normText.includes(normLot)) return true;
    const canonLot = ocrCanonical(normLot);
    return canonText.includes(canonLot);
  });

  renderCertMatchList(matched);
  document.getElementById('certMatchWrap').style.display = 'block';
}

async function pdfFileToDataUrl(file){
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  const page = await pdf.getPage(1); // 첫 페이지만 사용 (출하승인서는 대부분 1페이지)
  const viewport = page.getViewport({ scale: 2.5 }); // 고해상도로 렌더링해야 OCR이 잘 됨
  const canvas = document.createElement('canvas');
  canvas.width = viewport.width;
  canvas.height = viewport.height;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  await page.render({ canvasContext: ctx, viewport }).promise;
  return canvas.toDataURL('image/png');
}

function loadCertImage(file){
  if(!file) return;
  certCropRect = null;
  certCropArmed = false;
  const isPdf = file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf');

    certImageDataUrl = dataUrl;

      zone.innerHTML = `<div id="certImgWrap" style="position:relative; display:inline-block; max-width:100%; line-height:0;">

      </div>`;
      setupCertCropHandlers();
    }
    const wrap = document.getElementById('certAnalyzeWrap');
    if(wrap) wrap.style.display = 'block';
    const cropBtn = document.getElementById('certCropBtn');
    if(cropBtn) cropBtn.textContent = '🔍 제조번호 부분만 선택해서 인식 정확도 높이기 (선택사항)';
    const cropHint = document.getElementById('certCropHint');
    if(cropHint) cropHint.style.display = 'none';
  };

  if(isPdf){
    if(!window['pdfjsLib']){ showToast('PDF 변환 라이브러리를 불러오지 못했어요 - 새로고침 후 다시 시도해주세요'); return; }
    const zone = document.getElementById('certPasteZone');
    if(zone) zone.innerHTML = '📄 PDF를 이미지로 변환하는 중...';
    pdfFileToDataUrl(file).then(finish).catch((err)=>{
      console.error('PDF 변환 실패:', err);
      showToast('PDF 변환에 실패했어요 - 캡처본(이미지)으로 올려주세요');
      if(zone){
        zone.innerHTML = '📋 여기를 클릭하고 Ctrl+V로 붙여넣기<br>또는 클릭해서 파일 선택<input type="file" id="certFileInput" accept="image/*,.pdf,application/pdf" style="display:none;">';
        initCertPasteZoneListeners();
      }
    });
    return;
  }

  const reader = new FileReader();
  reader.onload = (e)=> finish(e.target.result);
  reader.readAsDataURL(file);
}

function setupCertCropHandlers(){
  const overlay = document.getElementById('certCropOverlay');
  const img = document.getElementById('certPreviewImg');
  if(!overlay || !img) return;
  let startX = 0, startY = 0, selDiv = null, dragging = false;

  const getPos = (e)=>{
    const rect = overlay.getBoundingClientRect();
    const cx = e.touches ? e.touches[0].clientX : e.clientX;
    const cy = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: cx - rect.left, y: cy - rect.top, rect };
  };

  const onStart = (e)=>{
    if(!certCropArmed) return;
    e.preventDefault();
    e.stopPropagation();
    const p = getPos(e);
    startX = Math.max(0, Math.min(p.x, p.rect.width));
    startY = Math.max(0, Math.min(p.y, p.rect.height));
    dragging = true;
    if(selDiv) selDiv.remove();
    selDiv = document.createElement('div');
    selDiv.style.cssText = 'position:absolute; border:2px solid #1D4ED8; background:rgba(29,78,216,.15); pointer-events:none;';
    overlay.appendChild(selDiv);
  };
  const onMove = (e)=>{
    if(!dragging) return;
    e.preventDefault();
    const p = getPos(e);
    const curX = Math.max(0, Math.min(p.x, p.rect.width));
    const curY = Math.max(0, Math.min(p.y, p.rect.height));
    const left = Math.min(startX, curX), top = Math.min(startY, curY);
    const w = Math.abs(curX - startX), h = Math.abs(curY - startY);
    selDiv.style.left = left + 'px';
    selDiv.style.top = top + 'px';
    selDiv.style.width = w + 'px';
    selDiv.style.height = h + 'px';
  };
  const onEnd = ()=>{
    if(!dragging) return;
    dragging = false;
    const rect = overlay.getBoundingClientRect();
    const scaleX = img.naturalWidth / rect.width;
    const scaleY = img.naturalHeight / rect.height;
    const left = parseFloat(selDiv.style.left) || 0;
    const top = parseFloat(selDiv.style.top) || 0;
    const w = parseFloat(selDiv.style.width) || 0;
    const h = parseFloat(selDiv.style.height) || 0;
    if(w < 10 || h < 10){
      selDiv.remove();
      certCropRect = null;
      showToast('선택 영역이 너무 작아요 - 다시 드래그해주세요');
      return;
    }
    certCropRect = {
      x: Math.round(left * scaleX),
      y: Math.round(top * scaleY),
      w: Math.round(w * scaleX),
      h: Math.round(h * scaleY)
    };
    certCropArmed = false;
    overlay.style.cursor = 'default';
    const hint = document.getElementById('certCropHint');
    if(hint) hint.style.display = 'none';
    const btn = document.getElementById('certCropBtn');
    if(btn) btn.textContent = '✓ 영역 선택됨 · 다시 선택하기';
    showToast('영역이 선택됐어요 - 이 부분만 확대해서 인식해요');
  };

  overlay.addEventListener('click', (e)=> e.stopPropagation());
  overlay.addEventListener('mousedown', onStart);
  overlay.addEventListener('mousemove', onMove);
  overlay.addEventListener('mouseup', onEnd);
  overlay.addEventListener('touchstart', onStart, { passive:false });
  overlay.addEventListener('touchmove', onMove, { passive:false });
  overlay.addEventListener('touchend', onEnd);
}

// 선택 영역만 원본 해상도 그대로 잘라냄 (OCR 인식용 - 저장용 원본과는 별개)
function getCroppedDataUrl(dataUrl, rect){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    img.onload = ()=>{
      const canvas = document.createElement('canvas');
      canvas.width = rect.w;
      canvas.height = rect.h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, rect.x, rect.y, rect.w, rect.h, 0, 0, rect.w, rect.h);
      resolve(canvas.toDataURL('image/png'));
    };
    img.onerror = reject;
    img.src = dataUrl;
  });
}

function preprocessImageForOcr(dataUrl){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    img.onload = ()=>{
      const scale = 2; // 업스케일로 작은 글자 인식률 향상
      const w = img.width * scale;
      const h = img.height * scale;
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(img, 0, 0, w, h);
      try{
        const imageData = ctx.getImageData(0, 0, w, h);
        const d = imageData.data;
        for(let i = 0; i < d.length; i += 4){
          const gray = d[i]*0.299 + d[i+1]*0.587 + d[i+2]*0.114;
          let v = (gray - 128) * 1.4 + 128; // 흑백 변환 + 대비 강조
          v = Math.max(0, Math.min(255, v));
          d[i] = d[i+1] = d[i+2] = v;
        }
        ctx.putImageData(imageData, 0, 0);
      }catch(e){ console.warn('전처리 스킵:', e); }
      resolve(canvas.toDataURL('image/png'));
    };
    img.onerror = reject;
    img.src = dataUrl;
  });
}

// OCR이 흔히 헷갈리는 문자쌍들을 대표 문자 하나로 통일 (O/0, S/5, I·L/1, B/8, Z/2, G/6, D/0)
// 위치·개수 상관없이 여러 글자가 동시에 헷갈려도 한 번에 대응 가능
function ocrCanonical(str){
  return str
    .replace(/[O0D]/g, '0')
    .replace(/[S5]/g, '5')
    .replace(/[IL1]/g, '1')
    .replace(/[B8]/g, '8')
    .replace(/[Z2]/g, '2')
    .replace(/[G6]/g, '6');
}

function levenshtein(a, b){
  const m = a.length, n = b.length;
  if(Math.abs(m - n) > 2) return 99; // 길이 차이가 너무 크면 빠르게 포기 (성능 최적화)
  const dp = [];
  for(let i = 0; i <= m; i++){ dp.push(new Array(n + 1).fill(0)); dp[i][0] = i; }
  for(let j = 0; j <= n; j++) dp[0][j] = j;
  for(let i = 1; i <= m; i++){
    for(let j = 1; j <= n; j++){
      const cost = a[i - 1] === b[j - 1] ? 0 : 1;
      dp[i][j] = Math.min(dp[i - 1][j] + 1, dp[i][j - 1] + 1, dp[i - 1][j - 1] + cost);
    }
  }
  return dp[m][n];
}

// haystack 안에서 needle과 편집거리 maxDist 이내로 비슷한 부분문자열을 찾음 (삽입/삭제/치환 오류 모두 대응)
function fuzzyIncludes(haystack, needle, maxDist){
  const nLen = needle.length;
  if(nLen < 5) return false; // 너무 짧으면 오탐 위험 커서 제외
  const minWin = Math.max(1, nLen - maxDist);
  const maxWin = nLen + maxDist;
  for(let start = 0; start <= haystack.length - minWin; start++){
    for(let winLen = minWin; winLen <= maxWin; winLen++){
      if(start + winLen > haystack.length) break;
      const window = haystack.substr(start, winLen);
      if(levenshtein(window, needle) <= maxDist) return true;
    }
  }
  return false;
}

async function runCertOcr(){
  if(!certImageDataUrl){ showToast('이미지를 먼저 붙여넣거나 선택해주세요'); return; }
  document.getElementById('certAnalyzeWrap').style.display = 'none';
  document.getElementById('certProgressWrap').style.display = 'block';
  const progressEl = document.getElementById('certProgress');
  let worker = null;
  try{
    progressEl.textContent = '이미지 전처리 중...';
    const sourceForOcr = certCropRect ? await getCroppedDataUrl(certImageDataUrl, certCropRect) : certImageDataUrl;
    const preprocessed = await preprocessImageForOcr(sourceForOcr);

    progressEl.textContent = '언어 데이터 불러오는 중... (처음 1회만 오래 걸려요)';
    worker = await Tesseract.createWorker('eng', 1, {
      logger: (m)=>{
        if(m.status === 'recognizing text'){
          progressEl.textContent = `텍스트 인식 중... ${Math.round((m.progress||0)*100)}%`;
        } else if(m.status){
          progressEl.textContent = '분석 준비 중... (' + m.status + ')';
        }
      }
    });
    await worker.setParameters({
      tessedit_pageseg_mode: '6',
      tessedit_char_whitelist: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'
    });
    const result = await worker.recognize(preprocessed);
    await worker.terminate();
    worker = null;

    const rawText = (result && result.data && result.data.text) ? result.data.text : '';
    certRawText = rawText;
    const normText = rawText.replace(/[\s\-_]/g, '').toUpperCase();
    const canonText = ocrCanonical(normText);
    certCanonText = canonText;

    const matched = records.filter(r => {
      const normLot = (r.lot || '').replace(/[\s\-_]/g, '').toUpperCase();
      if(normLot.length < 4) return false;
      if(normText.includes(normLot)) return true;
      const canonLot = ocrCanonical(normLot);
      // 흔한 OCR 오인식 문자쌍(O/0, S/5, I·L/1, B/8, Z/2, G/6 등)을 대표 문자로 통일해서 재대조
      return canonText.includes(canonLot);
    });

    renderCertMatchList(matched);
    document.getElementById('certProgressWrap').style.display = 'none';
    document.getElementById('certMatchWrap').style.display = 'block';
  }catch(err){
    console.error('OCR error:', err);
    if(worker){ try{ await worker.terminate(); }catch(e){} }
    certRawText = '(OCR 분석 실패 - 아래에서 직접 검색해서 선택해주세요)';
    renderCertMatchList([]);
    document.getElementById('certProgressWrap').style.display = 'none';
    document.getElementById('certMatchWrap').style.display = 'block';
    showToast('OCR 분석에 실패했어요 - 검색해서 직접 선택해주세요');
  }
}

    </details>`;

  const filterText = certSearchText.trim().toLowerCase();

    return new Date(b.registeredAt) - new Date(a.registeredAt);

  if(certAutoMatchedCount === 0){
    summary.innerHTML = `OCR로 자동 매칭된 LOT은 없어요 · 위 검색창에서 직접 찾아 선택해주세요`;
  } else {

  }

  if(sorted.length === 0){
    list.innerHTML = `<div class="no-match">${filterText ? '검색 결과가 없어요' : '등록된 LOT이 없어요'}</div>${debugHtml}`;
  } else {
    list.innerHTML = sorted.map(r => {
      const dbgNormLot = (r.lot || '').replace(/[\s\-_]/g, '').toUpperCase();
      const dbgCanonLot = ocrCanonical(dbgNormLot);
      let dbgLabel = '❌ 텍스트에 없음';
      let dbgColor = '#B3261E';
      if(certCanonText && certCanonText.includes(dbgCanonLot)){
        dbgLabel = '✅ 정확히 포함됨';
        dbgColor = '#157347';
      }
      return `
      <div class="match-item">
        <input type="checkbox" class="cert-chk" data-id="${r.id}" ${certSelectedIds.has(r.id) ? 'checked' : ''} onchange="toggleCertSelect('${r.id}', this.checked)">
        <div class="m-info">
          <div class="m-lot">${escapeHtml(r.lot)} <span class="badge ${r.status}" style="margin-left:6px;">${STATUS_ICON[r.status] || ''} ${STATUS_LABEL[r.status]}</span></div>
          <div class="m-product">${escapeHtml(r.product)}${r.code ? ' · ' + escapeHtml(r.code) : ''}</div>
          <div style="font-size:10px; color:${dbgColor}; font-family:'JetBrains Mono',monospace; margin-top:3px;">정규화: ${escapeHtml(dbgCanonLot)} · ${dbgLabel}</div>
        </div>
      </div>`;
    }).join('') + (!filterText && truncated ? `<div class="hint" style="text-align:center;">최근 항목 20건까지만 표시 중 · 검색하면 전체에서 찾을 수 있어요</div>` : '') + debugHtml;
  }
  if(submitBtn) submitBtn.style.display = 'block';
}

function resizeImageToDataUrl(dataUrl, maxWidth, format, quality){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    img.onload = ()=>{
      let w = img.width, h = img.height;
      if(w > maxWidth){ h = Math.round(h * maxWidth / w); w = maxWidth; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, w, h);
      ctx.drawImage(img, 0, 0, w, h);
      resolve(format === 'png' ? canvas.toDataURL('image/png') : canvas.toDataURL('image/jpeg', quality));
    };
    img.onerror = reject;
    img.src = dataUrl;
  });
}

// Firestore 문서 1MB 한도 안에 들어오도록 압축 - 문서(흰 배경+텍스트)는 PNG가 무손실이면서도 용량이 작게 나오는 경우가 많아 PNG를 우선 시도하고, 그래도 용량 초과면 JPEG로 안전하게 폴백
async function compressCertImage(dataUrl){
  const targetChars = 900 * 1024 * 1.37; // 약 900KB 상당의 base64 문자열 길이
  const pngWidths = [1900, 1500, 1200];
  for(const w of pngWidths){
    const png = await resizeImageToDataUrl(dataUrl, w, 'png');
    if(png.length <= targetChars) return png;
  }
  // PNG로도 안 되면 JPEG로 폴백 (화질보다 저장 가능 여부 우선)
  const jpegSteps = [
    { maxWidth: 1500, quality: 0.8 },
    { maxWidth: 1300, quality: 0.6 },
    { maxWidth: 1000, quality: 0.5 },
    { maxWidth: 850, quality: 0.42 }
  ];
  let result = null;
  for(const step of jpegSteps){
    result = await resizeImageToDataUrl(dataUrl, step.maxWidth, 'jpeg', step.quality);
    if(result.length <= targetChars) break;
  }
  return result;
}

async function submitCertUpload(){
  const by = document.getElementById('cert_by').value.trim();
  const checkedIds = [...certSelectedIds];
  if(!by || checkedIds.length === 0){
    document.getElementById('cert_err').style.display = 'block';
    return;
  }
  const submitBtn = document.getElementById('certSubmitBtn');
  submitBtn.disabled = true;

  const now = new Date().toISOString();
  let certObj = null;
  let dupCheck = null;

  if(certUploadMode === 'text'){
    submitBtn.textContent = '업로드 중...';
    const textVal = document.getElementById('certTextInput') ? document.getElementById('certTextInput').value : certRawText;
    if(!textVal || !textVal.trim()){
      showToast('붙여넣은 텍스트가 없어요');
      submitBtn.disabled = false;
      submitBtn.textContent = '선택 항목에 성적서 첨부';
      return;
    }
    certObj = { text: textVal, uploadedBy: by, uploadedAt: now };
    dupCheck = (c)=> c.text === textVal;
  } else {
    submitBtn.textContent = '압축 중...';
    let compressedData = null;
    try{
      compressedData = await compressCertImage(certImageDataUrl);
    }catch(err){
      console.error('압축 실패:', err);
      showToast('이미지 압축에 실패했어요');
      submitBtn.disabled = false;
      submitBtn.textContent = '선택 항목에 성적서 첨부';
      return;
    }
    submitBtn.textContent = '업로드 중...';
    certObj = { data: compressedData, uploadedBy: by, uploadedAt: now };
    dupCheck = (c)=> c.data === compressedData;
  }

  let successCount = 0;
  let skippedDupCount = 0;
  for(const id of checkedIds){
    const rec = records.find(r => r.id === id);
    const alreadyExists = rec && Array.isArray(rec.certificates) && rec.certificates.some(dupCheck);
    if(alreadyExists){ skippedDupCount++; continue; }
    const ok = await window.fbAddCertificate(id, certObj);
    if(ok){
      if(rec){
        rec.certificates = rec.certificates || [];
        rec.certificates.push(certObj);
      }
      successCount++;
    }
  }
  render();
  closeOverlay('certOverlay');
  await saveMyName(by);
  if(successCount === 0 && skippedDupCount > 0){
    showToast('이미 같은 성적서가 첨부돼 있어서 건너뛰었어요');
  } else if(skippedDupCount > 0){
    showToast(`${successCount}건 첨부 완료 (동일 성적서 ${skippedDupCount}건은 중복이라 건너뜀)`);
  } else {
    showToast(successCount === checkedIds.length ? `${successCount}건에 성적서 첨부 완료` : `${successCount}/${checkedIds.length}건만 첨부됐어요`);
  }
}

function openCertImageFull(id, idx){
  const rec = records.find(r => r.id === id);
  if(!rec || !rec.certificates || !rec.certificates[idx]) return;
  const src = rec.certificates[idx].data || rec.certificates[idx].url;
  try{
    if(src.startsWith('data:')){
      const arr = src.split(',');
      const mimeMatch = arr[0].match(/:(.*?);/);
      const mime = mimeMatch ? mimeMatch[1] : 'image/png';
      const bstr = atob(arr[1]);
      let n = bstr.length;
      const u8arr = new Uint8Array(n);
      while(n--){ u8arr[n] = bstr.charCodeAt(n); }
      const blob = new Blob([u8arr], { type: mime });
      const blobUrl = URL.createObjectURL(blob);
      window.open(blobUrl, '_blank');
      setTimeout(()=> URL.revokeObjectURL(blobUrl), 60000);
    } else {
      window.open(src, '_blank');
    }
  }catch(e){
    console.error('이미지 열기 실패:', e);
    showToast('이미지를 여는 데 실패했어요');
  }
}

// 이메일에서 복사한 표가 셀마다 줄바꿈으로 흩어진 경우, 짧은 셀들의 연속 구간을 찾아 표로 재구성 (표시 전용, 매칭용 원본 텍스트는 건드리지 않음)
function tidyCertText(raw){
  try{
    const lines = raw.split(/\r?\n/).map(l => l.trim());
    const blocks = lines.filter(l => l.length > 0); // 빈 줄 없이 줄바꿈 한 번씩만 쓰는 실제 이메일 포맷 대응 (줄 하나 = 셀 하나)
    const isCellLike = (b) => b.length > 0 && b.length <= 30
      && !/[.!?]\s*$/.test(b)
      && !/(습니다|니다|드립니다|바랍니다|감사합니다|드림)\s*$/.test(b)
      && b.split(/\s+/).length <= 4;

    let bestStart = -1, bestLen = 0, curStart = -1;
    for(let i = 0; i <= blocks.length; i++){
      const ok = i < blocks.length && isCellLike(blocks[i]);
      if(ok){
        if(curStart === -1) curStart = i;
      } else {
        if(curStart !== -1){
          const len = i - curStart;
          if(len > bestLen){ bestLen = len; bestStart = curStart; }
          curStart = -1;
        }
      }
    }
    if(bestLen < 6) return null; // 표로 보기엔 셀 수가 너무 적음

    let cols = null;
    for(const c of [6, 5, 4, 7, 3, 8]){
      if(bestLen % c === 0 && bestLen / c >= 2){ cols = c; break; }
    }
    if(!cols) return null;

    const cells = blocks.slice(bestStart, bestStart + bestLen);
    const rows = [];
    for(let i = 0; i < cells.length; i += cols) rows.push(cells.slice(i, i + cols));

    return {
      before: blocks.slice(0, bestStart).join('\n'),
      rows,
      after: blocks.slice(bestStart + bestLen).join('\n')
    };
  }catch(e){ return null; }
}

// tidyCertText 결과를 HTML(표+앞뒤 문단)로 렌더링. 재구성 실패 시 원본 텍스트를 그대로 pre로 보여줌
function renderCertTextHtml(rawText, opts){
  opts = opts || {};
  const preStyle = opts.preStyle || "white-space:pre-wrap; font-size:12px; padding:12px; margin:0; background:#FBFCFD; max-height:220px; overflow-y:auto; font-family:'JetBrains Mono',monospace;";
  const tidy = tidyCertText(rawText);
  if(!tidy){
    return `<pre style="${preStyle}">${escapeHtml(rawText)}</pre>`;
  }
  const [headerRow, ...dataRows] = tidy.rows;
  const tableHtml = `
    <table style="width:100%; border-collapse:collapse; font-size:12px; margin:10px 0;">
      <thead><tr>${headerRow.map(h => `<th style="border:1px solid #D7DEE5; background:#EAF0F5; padding:6px 8px; text-align:center;">${escapeHtml(h)}</th>`).join('')}</tr></thead>
      <tbody>${dataRows.map(row => `<tr>${row.map(v => `<td style="border:1px solid #D7DEE5; padding:6px 8px;">${escapeHtml(v)}</td>`).join('')}</tr>`).join('')}</tbody>
    </table>`;
  return `<div style="padding:12px; background:#FBFCFD; font-size:12.5px; line-height:1.6;">
    ${tidy.before ? `<div style="white-space:pre-wrap; margin-bottom:4px;">${escapeHtml(tidy.before)}</div>` : ''}
    ${tableHtml}
    ${tidy.after ? `<div style="white-space:pre-wrap; margin-top:4px;">${escapeHtml(tidy.after)}</div>` : ''}
  </div>`;
}

function printCertificate(id, idx){
  const rec = records.find(r => r.id === id);
  if(!rec || !rec.certificates || !rec.certificates[idx]) return;
  const c = rec.certificates[idx];
  const win = window.open('', '_blank');
  if(!win){ showToast('팝업이 차단됐어요 - 팝업 허용 후 다시 시도해주세요'); return; }
  const bodyHtml = c.text
    ? renderCertTextHtml(c.text, { preStyle: "text-align:left; white-space:pre-wrap; font-size:13px; max-width:700px; margin:0 auto; font-family:'Malgun Gothic',monospace;" })
    : `<img src="${c.data || c.url}" alt="성적서">`;
  win.document.write(`<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8">
    <title>성적서 인쇄 - ${escapeHtml(rec.lot)}</title>
    <style>
      body{ margin:0; text-align:center; font-family:'Malgun Gothic',sans-serif; }
      img{ max-width:100%; display:block; margin:0 auto; }
      .p-btn{ margin:16px; padding:10px 20px; font-size:14px; cursor:pointer; }
      @media print{ .p-btn{ display:none; } body{ margin:0; } }
    </style></head><body>
    <button class="p-btn" onclick="window.print()">인쇄하기</button>
    ${bodyHtml}
    </body></html>`);
  win.document.close();
}

function openCertView(id){
  closeOverlay('certViewOverlay');
  const rec = records.find(r => r.id === id);
  if(!rec || !rec.certificates || rec.certificates.length === 0) return;
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.id = 'certViewOverlay';
  overlay.innerHTML = `
    <div class="modal">
      <h2>성적서 · ${escapeHtml(rec.lot)}</h2>
      <div class="cert-gallery" id="certGalleryList_${id}">
        ${rec.certificates.map((c, idx) => `
          <div class="cert-gallery-item">
            ${c.text
              ? renderCertTextHtml(c.text)
              : `<img src="${c.data || c.url}" alt="성적서" onclick="openCertImageFull('${id}', ${idx})">`}
            <div class="cert-gallery-meta" style="display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap;">
              <span>${c.text ? '📧 텍스트 첨부' : '🖼 이미지 첨부'} · ${escapeHtml(c.uploadedBy || '')} · ${c.uploadedAt ? fmtDate(c.uploadedAt) : ''}</span>
              <div style="display:flex; gap:6px;">
                <button class="btn-sm btn-cert" onclick="printCertificate('${id}', ${idx})">인쇄</button>
                <button class="btn-sm btn-del" onclick="deleteCertificate('${id}', ${idx})">삭제</button>
              </div>
            </div>
          </div>`).join('')}
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" style="flex:1;" onclick="closeOverlay('certViewOverlay')">닫기</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', (e)=>{ if(e.target === overlay) closeOverlay('certViewOverlay'); });
}

async function deleteCertificate(id, idx){
  const rec = records.find(r => r.id === id);
  if(!rec || !rec.certificates || !rec.certificates[idx]) return;
  showAppConfirm(
    '이 성적서를 삭제할까요? 삭제하면 되돌릴 수 없어요.',
    '삭제',
    ()=> doDeleteCertificate(id, idx)
  );
}

async function doDeleteCertificate(id, idx){
  const rec = records.find(r => r.id === id);
  if(!rec || !rec.certificates || !rec.certificates[idx]) return;
  const target = rec.certificates[idx];
  const ok = await window.fbRemoveCertificate(id, target);
  if(ok){
    rec.certificates.splice(idx, 1);
    render();
    if(rec.certificates.length > 0){
      openCertView(id);
    } else {
      closeOverlay('certViewOverlay');
    }
    showToast('성적서 삭제 완료');
  } else {
    showToast('삭제에 실패했어요');
  }
}

    <div class="setup-box">
      <div class="setup-icon">🔧</div>
      <h2>Firebase 설정이 필요해요</h2>
      <p>이 파일의 &lt;script type="module"&gt; 안 <code>firebaseConfig</code> 값을<br>
      Firebase 콘솔에서 복사한 값으로 채워야 앱이 동작해요.</p>
    </div>`;
  document.body.appendChild(el);
}

function showLoginScreen(){
  document.getElementById('app').style.display = 'none';
  const el = document.createElement('div');
  el.className = 'setup-screen';
  el.id = 'loginScreen';
  el.innerHTML = `
    <div class="setup-box" style="text-align:center;">
      <div class="setup-icon">🔒</div>
      <h2>비밀번호 입력</h2>
      <p>팀 공용 비밀번호를 입력하면 들어갈 수 있어요.</p>
      <input class="login-input" id="loginPw" type="password" placeholder="비밀번호">
      <div class="login-err" id="loginErr">비밀번호가 틀렸어요. 다시 확인해주세요.</div>
      <button class="btn-submit" style="width:100%; margin-top:14px;" id="loginBtn">입장</button>
      <button class="btn-cancel" style="width:100%; margin-top:10px;" id="guestBtn">게스트로 둘러보기 (조회 전용)</button>
      <div class="login-err" id="guestErr">게스트 접속에 실패했어요. 잠시 후 다시 시도해주세요.</div>
      <div style="margin-top:18px;">
        <a href="#" id="adminModeLink" style="font-size:12px; color:var(--ink-muted); text-decoration:underline;">관리자 모드</a>
      </div>
    </div>`;
  document.body.appendChild(el);

  document.getElementById('adminModeLink').addEventListener('click', (e)=>{
    e.preventDefault();
    showAdminLoginScreen();
  });

  const submit = async ()=>{
    const pw = document.getElementById('loginPw').value;
    if(!pw) return;
    const btn = document.getElementById('loginBtn');
    const err = document.getElementById('loginErr');
    err.style.display = 'none';
    btn.textContent = '확인 중...';
    btn.disabled = true;
    const ok = await window.fbLogin(pw);
    if(ok){
      el.remove();
      document.getElementById('app').style.display = '';
      // isGuestMode는 fbOnAuthChange 콜백에서 갱신됨
    } else {
      err.style.display = 'block';
      btn.textContent = '입장';
      btn.disabled = false;
    }
  };
  document.getElementById('loginBtn').addEventListener('click', submit);
  document.getElementById('loginPw').addEventListener('keydown', (e)=>{ if(e.key === 'Enter') submit(); });
  document.getElementById('loginPw').focus();

  document.getElementById('guestBtn').addEventListener('click', async ()=>{
    const gbtn = document.getElementById('guestBtn');
    const gerr = document.getElementById('guestErr');
    gerr.style.display = 'none';
    gbtn.textContent = '접속 중...';
    gbtn.disabled = true;
    const ok = await window.fbGuestLogin();
    if(ok){
      el.remove();
      document.getElementById('app').style.display = '';
      // isGuestMode는 fbOnAuthChange 콜백에서 갱신됨
    } else {
      gerr.style.display = 'block';
      gbtn.textContent = '게스트로 둘러보기 (조회 전용)';
      gbtn.disabled = false;
    }
  });
}

function showAdminLoginScreen(){
  const existing = document.getElementById('loginScreen');
  if(existing) existing.remove();
  const el = document.createElement('div');
  el.className = 'setup-screen';
  el.id = 'loginScreen';
  el.innerHTML = `
    <div class="setup-box" style="text-align:center;">
      <div class="setup-icon">🛠️</div>
      <h2>관리자 로그인</h2>
      <p>관리자 전용 비밀번호를 입력해주세요.</p>
      <input class="login-input" id="adminPw" type="password" placeholder="관리자 비밀번호">
      <div class="login-err" id="adminErr">비밀번호가 틀렸어요. 다시 확인해주세요.</div>
      <button class="btn-submit" style="width:100%; margin-top:14px;" id="adminLoginBtn">관리자로 입장</button>
      <button class="btn-cancel" style="width:100%; margin-top:10px;" id="backToTeamBtn">← 일반 로그인으로</button>
    </div>`;
  document.body.appendChild(el);

  const submit = async ()=>{
    const pw = document.getElementById('adminPw').value;
    if(!pw) return;
    const btn = document.getElementById('adminLoginBtn');
    const err = document.getElementById('adminErr');
    err.style.display = 'none';
    btn.textContent = '확인 중...';
    btn.disabled = true;
    const ok = await window.fbAdminLogin(pw);
    if(ok){
      el.remove();
      document.getElementById('app').style.display = '';
      // isAdminMode는 fbOnAuthChange 콜백에서 갱신됨
    } else {
      err.style.display = 'block';
      btn.textContent = '관리자로 입장';
      btn.disabled = false;
    }
  };
  document.getElementById('adminLoginBtn').addEventListener('click', submit);
  document.getElementById('adminPw').addEventListener('keydown', (e)=>{ if(e.key === 'Enter') submit(); });
  document.getElementById('adminPw').focus();
  document.getElementById('backToTeamBtn').addEventListener('click', ()=>{ el.remove(); showLoginScreen(); });
}

(async function init(){
  loadMyName();
  await waitForFirebase();
  if(!window.__firebaseReady){
    showSetupNeeded();
    return;
  }
  window.fbOnAuthChange((isLoggedIn, isAnonymous, isAdmin)=>{
    if(isLoggedIn){
      isGuestMode = !!isAnonymous;
      isAdminMode = !!isAdmin;
      const existingLogin = document.getElementById('loginScreen');
      if(existingLogin) existingLogin.remove();
      document.getElementById('app').style.display = '';
      applyGuestModeUI();
      applyAdminModeUI();
      initRealtimeSync();
    } else {
      isGuestMode = false;
      isAdminMode = false;
      showLoginScreen();
    }
  });
})();
